name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tcpdump (filter parity test)
        run: sudo apt-get update -q && sudo apt-get install -y -q tcpdump
      - run: perl -v | head -2
      - run: make check
      - run: prove -l -v t/08-tcpdump.t
      - run: make test
      - run: make bench-quick

  perl-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ['5.24', '5.30', '5.40']
    steps:
      - uses: actions/checkout@v4
      # run inside the official image with docker directly: the perl:5.24
      # image's glibc is too old for the Node runtime used by `container:` jobs
      - name: make test && make bench-quick (perl ${{ matrix.perl }})
        run: docker run --rm -v "$PWD:/src" -w /src perl:${{ matrix.perl }} sh -c 'perl -v | head -2 && make test && make bench-quick'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make bench-quick
